
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet-development
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U wallet -d wallet"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5433:5432"

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      API_TOKEN: ${API_TOKEN:-recruitment-test-token}
      PORT: 8080
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: wallet
      PGUSER: wallet
      PGPASSWORD: wallet-development
    ports:
      - "8080:8080"

volumes:
  postgres-data:
